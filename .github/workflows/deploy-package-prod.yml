name: Deploy Selected Package to Production

on:
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Authenticate to Production
        run: |
          echo "${{ secrets.PROD_SFDX_AUTH_URL }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias PROD

      - name: Show Release Package
        run: |
          cat manifest/package.xml

      - name: Validate Production Deployment
        run: |
          sf project deploy validate \
            --target-org PROD \
            --manifest manifest/package.xml \
            --test-level RunRelevantTests \
            --wait 120

      - name: Deploy Selected Package
        run: |
          sf project deploy start \
            --target-org PROD \
            --manifest manifest/package.xml \
            --test-level RunRelevantTests \
            --wait 120
            